name: Monitorar disponibilidade do Streamlit

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: read

jobs:
  verificar-streamlit:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Verificar endpoint de saude do Streamlit
        env:
          STREAMLIT_APP_URL: ${{ secrets.STREAMLIT_APP_URL }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${STREAMLIT_APP_URL:-}" ]; then
            echo "ERRO: configure o secret STREAMLIT_APP_URL."
            exit 1
          fi

          HEALTH_URL="${STREAMLIT_APP_URL%/}/_stcore/health"

          echo "Verificando disponibilidade do Streamlit..."

          STATUS=$(curl --silent --show-error \
            --output /dev/null \
            --write-out '%{http_code}' \
            --connect-timeout 15 \
            --max-time 25 \
            "$HEALTH_URL")

          echo "HTTP: $STATUS"

          if [ "$STATUS" = "200" ]; then
            echo "Streamlit respondeu com sucesso."
          else
            echo "Falha na verificacao de disponibilidade."
            exit 1
          fi
