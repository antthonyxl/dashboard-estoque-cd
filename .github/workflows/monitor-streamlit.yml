
name: Monitorar disponibilidade do Streamlit

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: read

jobs:
  verificar-streamlit:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar navegador
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Acessar dashboard com navegador
        env:
          STREAMLIT_APP_URL: ${{ secrets.STREAMLIT_APP_URL }}
        shell: bash
        run: |
          python - <<'PY'
          import os
          import re
          from playwright.sync_api import sync_playwright

          url = os.environ.get("STREAMLIT_APP_URL", "").strip()

          if not url.startswith("https://"):
              raise SystemExit("Configure STREAMLIT_APP_URL com HTTPS.")

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              page = browser.new_page()
              page.set_default_timeout(20000)

              print("Abrindo dashboard...")
              page.goto(url, wait_until="domcontentloaded", timeout=60000)

              # Caso o Streamlit exiba a tela de repouso.
              wake = page.get_by_role(
                  "button",
                  name=re.compile("get this app back up", re.I)
              )

              if wake.count() > 0:
                  print("Solicitando reativacao do aplicativo...")
                  wake.first.click()

              print("Verificando carregamento do aplicativo...")

              try:
                  page.get_by_text(
                      re.compile("Análise de Quebras e Sobras", re.I)
                  ).first.wait_for(timeout=90000)

                  print("SUCESSO: dashboard carregado.")
              except Exception:
                  print("FALHA: dashboard nao carregou.")
                  print("Titulo:", page.title())
                  page.screenshot(
                      path="erro-streamlit.png",
                      full_page=True
                  )
                  raise
              finally:
                  browser.close()
          PY
